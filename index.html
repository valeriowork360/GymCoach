<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Allenamento</title>
<meta name="theme-color" content="#0e0f11">
<meta name="app-version" content="24">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=24">
</head>
<body>
<div id="app">
  <header class="top">
    <button class="icon-btn" id="btnList" aria-label="Elenco esercizi">☰</button>
    <div class="top-mid">
      <div class="top-sess" id="topSess">Allenamento</div>
      <div class="top-sub" id="topSub"></div>
    </div>
    <button class="icon-btn" id="btnStats" aria-label="Progressi">📈</button>
    <button class="icon-btn" id="btnArchive" aria-label="Archivio">🗂</button>
    <button class="icon-btn" id="btnSettings" aria-label="Impostazioni">⚙</button>
  </header>

  <section id="workout" hidden>
    <div class="player" id="player">
      <div class="frame" id="frame"></div>
      <div class="vchips" id="vchips"></div>
    </div>
    <div class="music" id="music">
      <div class="m-row">
        <div class="m-screen"><div id="ytM"></div><span class="m-ph" id="mPh">🎵</span></div>
        <button class="m-info" id="mInfo" type="button"><b id="mTitle">Musica</b><span id="mSub">Aggiungi un link YouTube</span></button>
        <button class="mini m-play" id="mPlay" type="button" aria-label="Riproduci o metti in pausa la musica">▶</button>
        <button class="mini" id="mMore" type="button" aria-label="Opzioni musica">⌄</button>
      </div>
      <div class="m-vols">
        <div class="vol"><button type="button" class="vbtn" id="muteV" aria-label="Audio video esercizio acceso/spento">🔇</button><input type="range" id="volV" min="0" max="100" step="5" aria-label="Volume video esercizio"><output id="oV">0</output></div>
        <div class="vol"><button type="button" class="vbtn" id="muteM" aria-label="Musica acceso/spento">🎵</button><input type="range" id="volM" min="0" max="100" step="5" aria-label="Volume musica"><output id="oM">35</output></div>
      </div>
      <div class="m-more" id="mPanel" hidden>
        <form class="m-form" id="mForm" autocomplete="off"><input class="inp" id="mIn" placeholder="Incolla un link YouTube (brano o playlist)" inputmode="url"><button class="btn acc" type="submit">Carica</button></form>
        <div class="m-recent" id="mRecent"></div>
        <label class="m-loop"><input type="checkbox" id="mLoop"> Ripeti brano / playlist</label>
      </div>
    </div>
    <div class="timer" id="timer" hidden>
      <span class="t-lab">Recupero</span>
      <span class="t-val" id="tVal">0:00</span>
      <div class="t-bar"><i id="tBar"></i></div>
      <button class="mini" id="tPlus">+15s</button>
      <button class="mini" id="tStop">Stop</button>
    </div>
    <div class="exbar" id="exbar"></div>
    <div class="chat" id="chat" aria-live="polite"></div>
    <div class="chips" id="chips"></div>
    <form class="composer" id="composer" autocomplete="off">
      <button type="button" class="icon-btn mic" id="btnMic" aria-label="Detta" hidden>🎤</button>
      <button type="button" class="icon-btn" id="btnPhoto" aria-label="Foto di un macchinario">📷</button>
      <input type="file" id="photoIn" accept="image/*" hidden>
      <input id="msg" placeholder="Es. 24 kg 9 rip RIR 2 — o fai una domanda" enterkeyhint="send">
      <button class="send" id="btnSend" aria-label="Invia">➤</button>
    </form>
  </section>

  <section id="home" class="home" hidden></section>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-card">
    <div class="sheet-head"><h2 id="sheetTitle"></h2><button class="icon-btn" id="sheetClose" aria-label="Chiudi">✕</button></div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>

<div id="bootErr" hidden style="position:fixed;inset:0;z-index:99;background:#0e0f11;color:#f2f3f5;font:15px/1.5 system-ui,sans-serif;padding:24px;display:flex;flex-direction:column;justify-content:center;gap:14px">
  <b style="font-size:20px">L'app non è partita correttamente</b>
  <span>Di solito succede quando il telefono ha tenuto in memoria una versione vecchia. I tuoi dati non vengono toccati.</span>
  <button id="bootFix" style="padding:14px;border-radius:12px;border:0;background:#d7ff3a;color:#121400;font-weight:700;font-size:16px">Ripara e ricarica</button>
  <small id="bootMsg" style="color:#9aa1ab;word-break:break-word"></small>
</div>
<script>
/* paracadute: se l'app non parte, mostra un pulsante che pulisce la cache e ricarica */
(function(){
  var shown=false;
  function show(msg){ if(window.__appOk||shown) return; shown=true; var b=document.getElementById("bootErr"); b.hidden=false; if(msg) document.getElementById("bootMsg").textContent="Dettaglio: "+msg; }
  window.addEventListener("error",function(e){ if(!window.__appOk && e && e.message) show(e.message+(e.filename?" ("+e.filename.split("/").pop()+":"+e.lineno+")":"")); });
  setTimeout(function(){ show(""); },6000);
  document.getElementById("bootFix").onclick=async function(){
    this.textContent="Riparo…";
    try{ var rs=await (navigator.serviceWorker&&navigator.serviceWorker.getRegistrations?navigator.serviceWorker.getRegistrations():[]); await Promise.all(rs.map(function(r){return r.unregister();})); }catch(e){}
    try{ var ks=await caches.keys(); await Promise.all(ks.map(function(k){return caches.delete(k);})); }catch(e){}
    location.replace(location.pathname+"?r="+Date.now());
  };
})();
</script>
<script src="data.js?v=24"></script>
<script src="app.js?v=24"></script>
</body>
</html>
