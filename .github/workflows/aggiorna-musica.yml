name: Aggiorna musica

on:
  schedule:
    - cron: "23 * * * *"     # controllo ogni ora; lo script aggiorna solo se sono passate 4 ore
  workflow_dispatch:          # "Run workflow" per aggiornare subito
  push:
    paths:
      - music_config.json

permissions:
  contents: write
  pages: write

concurrency:
  group: aggiorna-musica
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -U yt-dlp
      - name: Aggiorna music.json
        run: python scripts/update_music.py ${{ github.event_name != 'schedule' && '--force' || '' }}
      - name: Salva music.json
        run: |
          git config user.name "gymcoach-bot"
          git config user.email "gymcoach-bot@users.noreply.github.com"
          git add music.json
          if git diff --cached --quiet; then echo "Nessuna novità"; exit 0; fi
          git commit -m "Aggiorna musica"
          git pull --rebase
          git push
      - name: Ripubblica il sito
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
